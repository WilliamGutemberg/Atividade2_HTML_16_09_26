<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<body>
    <header>
        <h1>Cadastro de Usuário</h1>
    </header>
    <hr>
    <main>
        <form action="index.html">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required><br><br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required><br><br>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento""> <br><br>

                <label for=" foto">Foto de perfil:</label>
            <input type="file" id="foto"><br><br>

            <label for="satisfacao">O quanto você gosta de animais?</label>
            <input type="range" id="satisfacao" min="0" max="10"><br><br>

            <input type="submit" value="Cadastrar">
        </form>
        <a href="login.html">Já tem uma conta? Faça login aqui.</a><br>

</body>
